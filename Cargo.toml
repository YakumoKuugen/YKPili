[workspace]
resolver = "2"
members = ["crates/yk-app", "crates/yk-core", "crates/yk-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# 底座：GPUI Kit（含 gpui-pre + gpui-fast + gpui-component）
# 与 spike-gpui-kit 保持一致先用 0.7.3（已验证可编译、可叠层）；
# 0.8.0 起支持移动端，升级时需复核 theme/motion 等 API。
gpui = { package = "gpui-kit", version = "0.7.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# iOS 编译修复：backtrace 0.3.76 把 iOS 也划入 apple vendor，
# 但它用的 `_dyld_get_image_name` 是 macOS 私有 API，iOS 上不存在。
# 见 vendor/backtrace/src/symbolize/gimli.rs 里的注释。
[patch.crates-io]
backtrace = { path = "vendor/backtrace" }
