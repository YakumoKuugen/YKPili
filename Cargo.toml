[workspace]
resolver = "2"
members = ["crates/yk-app", "crates/yk-core", "crates/yk-ui", "crates/yk-media"]
# 这些是独立验证工程，有自己的 Cargo.toml 与 lock，不参与主 workspace。
exclude = ["spike-gpui-kit", "spike-gpui-surface", "spike-mpv-wgpu", "spike-avalonia-handles"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# 底座：GPUI Kit（含 gpui-pre + gpui-fast + gpui-component）
# 0.8.0：支持移动端（gpui-pre-mobile），API 与 0.7.3 兼容（本次升级零改动）。
# 注意：gpui-fast feature 装不上 —— gpui-fast-web 要 unicode-properties =0.1.3，
# 而 gpui-pre-macos 的 cocoa 依赖与之冲突。详见设计文档附录 D 事实 16。
gpui = { package = "gpui-kit", version = "0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# iOS 编译修复：backtrace 0.3.76 把 iOS 也划入 apple vendor，
# 但它用的 `_dyld_get_image_name` 是 macOS 私有 API，iOS 上不存在。
# 见 vendor/backtrace/src/symbolize/gimli.rs 里的注释。
[patch.crates-io]
backtrace = { path = "vendor/backtrace" }
