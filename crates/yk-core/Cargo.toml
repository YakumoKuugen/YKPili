[package]
name = "yk-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
percent-encoding = "2"
# 真实数据源：blocking + rustls（不依赖系统 OpenSSL）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
