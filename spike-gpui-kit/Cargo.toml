[package]
name = "gpui-kit-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.7.3"
# 只对 macOS 平台层启用 test-support：这样能拿到 Window::render_to_image，
# 又不会激活 gpui-kit 的 test-support（后者会拉入 gpui-fast 并造成 cocoa 版本冲突）
gpui-pre-macos = { version = "0.3.9", features = ["test-support"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVBase", "CVReturn"] }
image = { version = "0.25", features = ["png"] }
