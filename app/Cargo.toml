[workspace]
resolver = "2"
members = ["crates/yk-app", "crates/yk-core", "crates/yk-ui", "crates/yk-media"]
# demo/验证工程在仓库根目录 demos/，各自独立，不属于本 workspace。

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# 底座：GPUI Kit（含 gpui-pre + gpui-fast + gpui-component）
# 0.8.0：支持移动端（gpui-pre-mobile），API 与 0.7.3 兼容（本次升级零改动）。
# 注意：gpui-fast feature 装不上 —— gpui-fast-web 要 unicode-properties =0.1.3，
# 而 gpui-pre-macos 的 cocoa 依赖与之冲突。详见设计文档附录 D 事实 16。
gpui = { package = "gpui-kit", version = "0.8.0", features = ["gpui-fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# iOS 编译修复：backtrace 0.3.76 把 iOS 也划入 apple vendor，
# 但它用的 `_dyld_get_image_name` 是 macOS 私有 API，iOS 上不存在。
# 见 vendor/backtrace/src/symbolize/gimli.rs 里的注释。
[patch.crates-io]
backtrace = { path = "vendor/backtrace" }
# gpui-fast-web 0.1.10 硬依赖 unicode-properties =0.1.3，但 0.1.3 已被 yank
# （索引里只剩 0.1.4），导致 gpui-kit 0.8.0 的 gpui-fast 装不上。
# 这里用 0.1.4 源码、版本号改成 0.1.3，满足精确约束且离线可用。
# 补丁版本 API 兼容；上游修好后删掉此条即可。
unicode-properties = { path = "vendor/unicode-properties" }
