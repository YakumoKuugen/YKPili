[package]
name = "yk-player"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gpui.workspace = true
yk-domain = { path = "../core" }
yk-infra = { path = "../infra" }
yk-theme = { path = "../theme" }
yk-components = { path = "../components" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVBase", "CVReturn"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 只用来构造 GPUI `RenderImage` 需要的 `image::Frame`（Windows 视频贴图路径）。
image = { version = "0.25", default-features = false }
