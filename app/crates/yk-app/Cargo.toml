[package]
name = "yk-app"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "ykpili"
path = "src/main.rs"

[lib]
name = "yk_app"
path = "src/lib.rs"

[dependencies]
gpui.workspace = true
yk-ui = { path = "../yk-ui" }
yk-core = { path = "../yk-core" }
yk-media = { path = "../yk-media" }
futures = "0.3"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVBase", "CVReturn"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 只用来构造 GPUI `RenderImage` 需要的 `image::Frame`（Windows 视频贴图路径）。
image = { version = "0.25", default-features = false }
# 取 HWND，把系统标题栏切成深色（应用是深色主题，白标题栏太刺眼）。
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
# exe 图标 + 版本信息（需要 Windows SDK 的 rc.exe）。
winresource = "0.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "search_visual"
path = "tests/search_visual.rs"
harness = false

[[test]]
name = "messages_visual"
path = "tests/messages_visual.rs"
harness = false

[[test]]
name = "topbar_visual"
path = "tests/topbar_visual.rs"
harness = false

[[test]]
name = "player_visual"
path = "tests/player_visual.rs"
harness = false

[[test]]
name = "player_hover"
path = "tests/player_hover.rs"
harness = false

[[test]]
name = "pages_visual"
path = "tests/pages_visual.rs"
harness = false

[[test]]
name = "danmaku_visual"
path = "tests/danmaku_visual.rs"
harness = false

[[test]]
name = "comments_visual"
path = "tests/comments_visual.rs"
harness = false

[[test]]
name = "dynamic_detail_copy"
path = "tests/dynamic_detail_copy.rs"
harness = false