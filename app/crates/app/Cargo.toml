[package]
name = "yk-app"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "ykpili"
path = "src/main.rs"

[lib]
name = "yk_app"
path = "src/lib.rs"

[dependencies]
gpui.workspace = true
yk-theme = { path = "../theme" }
yk-components = { path = "../components" }
yk-domain = { path = "../core" }
yk-player = { path = "../player" }
yk-library = { path = "../library" }
yk-shell = { path = "../shell" }
yk-infra = { path = "../infra" }

[target.'cfg(target_os = "windows")'.dependencies]
# 取 HWND，把系统标题栏切成深色（应用是深色主题，白标题栏太刺眼）。
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
# exe 图标 + 版本信息（需要 Windows SDK 的 rc.exe）。
winresource = "0.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "search_visual"
path = "tests/search_visual.rs"
harness = false

